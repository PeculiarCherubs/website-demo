name: Validate repository

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check content integrity
        run: node scripts/check-content-integrity.js

      - name: Check repository and navigation integrity
        run: node scripts/check-navigation-integrity.js

      - name: Check CSS/UI integrity
        run: node scripts/check-ui-integrity.js


      - name: Check security integrity
        run: node scripts/check-security-integrity.js

      - name: Check final QA integrity
        run: node scripts/check-final-qa.js
